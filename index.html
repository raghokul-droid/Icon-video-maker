<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Icon Sketch Maker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #060a12;
  color: #e2e8f0;
  font-family: system-ui, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header */
#header {
  padding: 10px 16px;
  background: #0f172a;
  border-bottom: 1px solid rgba(99,102,241,0.2);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
#header h1 {
  font-size: 16px;
  font-weight: 800;
  background: linear-gradient(90deg,#818cf8,#34d399);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Canvas area */
#stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
#main-canvas {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  background: white;
}

/* Progress bar */
#progress-bar {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: rgba(99,102,241,0.15);
  display: none;
  z-index: 10;
}
#progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#6366f1,#34d399);
  transition: width 0.1s linear;
  box-shadow: 0 0 10px rgba(99,102,241,0.8);
}

/* Status badge */
#status-badge {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 18px;
  background: rgba(10,15,28,0.92);
  border: 1px solid rgba(99,102,241,0.35);
  border-radius: 100px;
  font-size: 12px;
  color: #a5b4fc;
  font-weight: 600;
  white-space: nowrap;
  display: none;
  backdrop-filter: blur(10px);
}

/* Stop button */
#stop-btn {
  position: absolute;
  top: 14px; right: 14px;
  padding: 7px 14px;
  background: rgba(220,38,38,0.9);
  color: white;
  border: none;
  border-radius: 100px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  display: none;
  z-index: 20;
}

/* Processing overlay */
#proc-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  z-index: 30;
  backdrop-filter: blur(4px);
}
.spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(99,102,241,0.2);
  border-top: 3px solid #6366f1;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#proc-text { color: #94a3b8; font-size: 13px; font-weight: 600; }

/* Empty state */
#empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  padding: 30px;
}
#empty-state .icon { font-size: 52px; }
#empty-state h2 { font-size: 20px; font-weight: 800; color: #f1f5f9; }
#empty-state p { font-size: 13px; color: #64748b; line-height: 1.6; max-width: 280px; }
#upload-zone {
  width: 100%;
  max-width: 300px;
  padding: 20px;
  border: 2px dashed rgba(99,102,241,0.4);
  border-radius: 14px;
  background: rgba(99,102,241,0.05);
  cursor: pointer;
  text-align: center;
  font-size: 13px;
  color: #818cf8;
  font-weight: 700;
  transition: all 0.2s;
}
#upload-zone:hover { border-color: #6366f1; background: rgba(99,102,241,0.1); }
#upload-zone.drag-over { border-color: #34d399; background: rgba(52,211,153,0.08); color: #34d399; }

/* Bottom bar */
#bottom-bar {
  background: rgba(10,15,28,0.98);
  border-top: 1px solid rgba(99,102,241,0.12);
  padding: 12px 14px;
  display: none;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

/* Info row */
#info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #64748b;
  font-weight: 600;
}
#info-row span { color: #a5b4fc; }

/* Settings row */
#settings-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.setting-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #94a3b8;
  font-weight: 600;
}
.setting-item input[type=range] {
  width: 70px; height: 4px;
  border-radius: 2px;
  outline: none; border: none;
  cursor: pointer;
  appearance: none; -webkit-appearance: none;
  accent-color: #6366f1;
  background: linear-gradient(to right,#6366f1 50%,#1e293b 50%);
}
.setting-item input[type=range]::-webkit-slider-thumb {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #6366f1;
  cursor: pointer;
  -webkit-appearance: none;
  border: 2px solid rgba(255,255,255,0.2);
}
.val-badge {
  background: rgba(99,102,241,0.15);
  border: 1px solid rgba(99,102,241,0.3);
  padding: 1px 7px;
  border-radius: 5px;
  font-family: monospace;
  font-size: 11px;
  color: #f1f5f9;
  min-width: 32px;
  text-align: center;
}

/* Action row */
#action-row { display: flex; gap: 10px; }
#play-btn {
  flex: 1;
  padding: 12px;
  background: linear-gradient(135deg,#4f46e5,#7c3aed);
  color: white;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(99,102,241,0.35);
}
#play-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#change-btn {
  padding: 12px 14px;
  background: rgba(30,41,59,0.8);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 12px;
  cursor: pointer;
  font-size: 12px;
  color: #94a3b8;
  font-weight: 600;
}

/* Icon preview strip */
#icon-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
}
#icon-strip::-webkit-scrollbar { height: 3px; }
#icon-strip::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 2px; }
.icon-thumb {
  width: 44px; height: 44px;
  flex-shrink: 0;
  border-radius: 8px;
  border: 1.5px solid rgba(99,102,241,0.3);
  background: white;
  object-fit: contain;
  padding: 2px;
}
.icon-thumb.current { border-color: #6366f1; box-shadow: 0 0 8px rgba(99,102,241,0.5); }
.icon-thumb.done { border-color: #34d399; opacity: 0.7; }
</style>
</head>
<body>

<div id="header">
  <span style="font-size:20px">✏️</span>
  <h1>Icon Sketch Maker</h1>
</div>

<div id="stage">
  <canvas id="main-canvas"></canvas>

  <!-- Empty / upload state -->
  <div id="empty-state">
    <div class="icon">🖼️</div>
    <h2>Upload Icon Sheet</h2>
    <p>Upload an image containing multiple icons arranged in a grid. The app will detect and sketch them one by one.</p>
    <div id="upload-zone" onclick="fileInput.click()"
      ondragover="onDragOver(event)"
      ondragleave="onDragLeave(event)"
      ondrop="onDrop(event)">
      📂 Tap or drag & drop image here
    </div>
  </div>

  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="status-badge"></div>
  <button id="stop-btn" onclick="stopAnim()">⏹ Stop</button>
  <div id="proc-overlay">
    <div class="spinner"></div>
    <div id="proc-text">Detecting icons…</div>
  </div>
</div>

<!-- Bottom bar (shown after upload) -->
<div id="bottom-bar">
  <div id="info-row">
    <div id="info-text">0 icons · 0 pages</div>
    <div>6 icons per page</div>
  </div>

  <div id="icon-strip"></div>

  <div id="settings-row">
    <div class="setting-item">
      Thickness
      <input type="range" id="sl-thick" min="1" max="5" step="0.5" value="2" oninput="updateSlider(this,'thick')"/>
      <span class="val-badge" id="v-thick">2</span>
    </div>
    <div class="setting-item">
      Threshold
      <input type="range" id="sl-thresh" min="50" max="230" value="160" oninput="updateSlider(this,'thresh')"/>
      <span class="val-badge" id="v-thresh">160</span>
    </div>
    <div class="setting-item">
      Speed
      <input type="range" id="sl-speed" min="1" max="12" value="4" oninput="updateSlider(this,'speed')"/>
      <span class="val-badge" id="v-speed">4s</span>
    </div>
  </div>

  <div id="action-row">
    <button id="change-btn" onclick="fileInput.click()">🖼 Change</button>
    <button id="play-btn" onclick="playAnim()">▶ Sketch All Icons</button>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)"/>

<script>
// ── Canvas & State ───────────────────────────────────────
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const CW = 1080, CH = 1080; // square canvas
canvas.width = CW; canvas.height = CH;

// Init white canvas
ctx.fillStyle = '#fff';
ctx.fillRect(0, 0, CW, CH);

let icons = [];        // Array of {canvas, dataURL} per detected icon
let settings = { thick: 2, thresh: 160, speed: 4 };
let isAnimating = false;
let stopFlag = false;
let animRaf = null;

const ICONS_PER_PAGE = 6;
const COLS = 3, ROWS = 2; // 3x2 grid per page (layout for the OUTPUT animation, not detection)
const PAD = 40, GAP = 24;
const CELL_W = Math.floor((CW - PAD*2 - GAP*(COLS-1)) / COLS);
const CELL_H = Math.floor((CH - PAD*2 - GAP*(ROWS-1)) / ROWS);

function getCellRect(slotInPage) {
  const row = Math.floor(slotInPage / COLS);
  const col = slotInPage % COLS;
  return {
    x: PAD + col * (CELL_W + GAP),
    y: PAD + row * (CELL_H + GAP),
    w: CELL_W,
    h: CELL_H
  };
}

// ── Slider ───────────────────────────────────────────────
function updateSlider(el, key) {
  settings[key] = parseFloat(el.value);
  const unit = key === 'speed' ? 's' : '';
  document.getElementById('v-' + key).textContent = el.value + unit;
  // Update gradient
  const min = parseFloat(el.min), max = parseFloat(el.max);
  const pct = ((settings[key] - min) / (max - min)) * 100;
  el.style.background = `linear-gradient(to right,#6366f1 ${pct}%,#1e293b ${pct}%)`;
}

// ── File handling ─────────────────────────────────────────
function handleFile(input) {
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  const reader = new FileReader();
  reader.onload = e => processImage(e.target.result);
  reader.readAsDataURL(file);
}

function onDragOver(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.add('drag-over');
}
function onDragLeave(e) {
  document.getElementById('upload-zone').classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag-over');
  const file = Array.from(e.dataTransfer.files).find(f => f.type.startsWith('image/'));
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => processImage(ev.target.result);
  reader.readAsDataURL(file);
}

// ── Icon Detection ────────────────────────────────────────
// Strategy: instead of guessing a uniform row/column grid from brightness
// bands (which breaks when icons in different columns have different
// heights — it slices real icons in half), we detect each icon as a
// connected blob of non-white pixels. A small dilation step bridges icons
// that have gaps in them (rings, colons, dashed lines) without merging
// separate icons together. Blobs are then grouped into reading order
// (row by row, left to right) using their actual positions.
function processImage(src) {
  showProc('Analyzing image…');
  const img = new Image();
  img.onload = () => {
    const tmp = document.createElement('canvas');
    tmp.width = img.width; tmp.height = img.height;
    const tCtx = tmp.getContext('2d');
    tCtx.fillStyle = '#fff';
    tCtx.fillRect(0, 0, img.width, img.height);
    tCtx.drawImage(img, 0, 0);

    showProc('Detecting icons…');

    const boxes = detectIcons(tCtx.canvas, img.width, img.height);

    if(!boxes.length) {
      hideProc();
      alert('No icons could be detected in this image. Try an image with clearer separation between icons.');
      return;
    }

    showProc(`Found ${boxes.length} icons — extracting…`);

    icons = [];
    for(const box of boxes) {
      const ic = document.createElement('canvas');
      ic.width = box.w; ic.height = box.h;
      const iCtx = ic.getContext('2d');
      iCtx.fillStyle = '#fff';
      iCtx.fillRect(0, 0, box.w, box.h);
      iCtx.drawImage(img, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
      icons.push({ canvas: ic, dataURL: ic.toDataURL() });
    }

    hideProc();
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('bottom-bar').style.display = 'flex';
    renderIconStrip();
    updateInfo();
    drawPagePreview(0);
    document.getElementById('play-btn').disabled = false;
  };
  img.onerror = () => { hideProc(); alert('Could not load image.'); };
  img.src = src;
}

// Detect icons as connected components of non-white pixels.
// Returns an array of {x,y,w,h} boxes in full-resolution image coordinates,
// already sorted into reading order (top-to-bottom rows, left-to-right within a row).
function detectIcons(srcCanvas, W, H) {
  // Downscale for speed — detection doesn't need full resolution
  const maxDim = 800;
  const scale = Math.min(1, maxDim / Math.max(W, H));
  const sw = Math.max(1, Math.round(W * scale));
  const sh = Math.max(1, Math.round(H * scale));

  const small = document.createElement('canvas');
  small.width = sw; small.height = sh;
  const sCtx = small.getContext('2d');
  sCtx.drawImage(srcCanvas, 0, 0, sw, sh);
  const imgData = sCtx.getImageData(0, 0, sw, sh);
  const d = imgData.data;

  // Foreground mask: anything that isn't (near) white / transparent
  const fg = new Uint8Array(sw * sh);
  for(let i = 0; i < sw * sh; i++) {
    const r = d[i*4], g = d[i*4+1], b = d[i*4+2], a = d[i*4+3];
    const isWhite = a < 20 || (r > 244 && g > 244 && b > 244);
    fg[i] = isWhite ? 0 : 1;
  }

  // Dilate slightly so icons with internal gaps (rings, colons, dashed
  // outlines) are treated as a single blob. Radius is scaled to image size
  // so it works consistently regardless of source resolution.
  const radius = Math.max(1, Math.round(sw / 220));
  const dilated = dilate(fg, sw, sh, radius);

  // Connected component labeling (8-connectivity, iterative flood fill)
  const labels = new Int32Array(sw * sh).fill(-1);
  const stack = new Int32Array(sw * sh);
  const blobs = [];

  for(let start = 0; start < sw * sh; start++) {
    if(dilated[start] !== 1 || labels[start] !== -1) continue;

    let sp = 0;
    stack[sp++] = start;
    const blobId = blobs.length;
    labels[start] = blobId;

    let minX = start % sw, maxX = minX, minY = (start / sw) | 0, maxY = minY, count = 0;

    while(sp > 0) {
      const idx = stack[--sp];
      const x = idx % sw, y = (idx / sw) | 0;
      count++;
      if(x < minX) minX = x;
      if(x > maxX) maxX = x;
      if(y < minY) minY = y;
      if(y > maxY) maxY = y;

      for(let ny = y - 1; ny <= y + 1; ny++) {
        if(ny < 0 || ny >= sh) continue;
        const rowOff = ny * sw;
        for(let nx = x - 1; nx <= x + 1; nx++) {
          if(nx < 0 || nx >= sw) continue;
          const nIdx = rowOff + nx;
          if(dilated[nIdx] === 1 && labels[nIdx] === -1) {
            labels[nIdx] = blobId;
            stack[sp++] = nIdx;
          }
        }
      }
    }

    blobs.push({ minX, minY, maxX, maxY, count });
  }

  // Drop tiny noise blobs (stray pixels / JPEG artifacts)
  const minArea = Math.max(6, sw * sh * 0.00008);
  const filtered = blobs.filter(b =>
    b.count >= minArea && (b.maxX - b.minX) > 1 && (b.maxY - b.minY) > 1
  );

  // Map blob boxes back to full-resolution coordinates with a small pad
  const pad = 3;
  const boxesFull = filtered.map(b => {
    const x = Math.max(0, Math.floor(b.minX / scale) - pad);
    const y = Math.max(0, Math.floor(b.minY / scale) - pad);
    const x2 = Math.min(W, Math.ceil((b.maxX + 1) / scale) + pad);
    const y2 = Math.min(H, Math.ceil((b.maxY + 1) / scale) + pad);
    return { x, y, w: x2 - x, h: y2 - y };
  });

  return sortIntoGrid(boxesFull);
}

// Fast box dilation using separable horizontal + vertical max filter
function dilate(mask, w, h, radius) {
  if(radius <= 0) return mask;

  const tmp = new Uint8Array(w * h);
  for(let y = 0; y < h; y++) {
    const rowOff = y * w;
    for(let x = 0; x < w; x++) {
      let v = 0;
      const xs = Math.max(0, x - radius), xe = Math.min(w - 1, x + radius);
      for(let xx = xs; xx <= xe; xx++) {
        if(mask[rowOff + xx]) { v = 1; break; }
      }
      tmp[rowOff + x] = v;
    }
  }

  const out = new Uint8Array(w * h);
  for(let x = 0; x < w; x++) {
    for(let y = 0; y < h; y++) {
      let v = 0;
      const ys = Math.max(0, y - radius), ye = Math.min(h - 1, y + radius);
      for(let yy = ys; yy <= ye; yy++) {
        if(tmp[yy * w + x]) { v = 1; break; }
      }
      out[y * w + x] = v;
    }
  }
  return out;
}

// Groups detected boxes into rows by y-position, then sorts each row
// left-to-right — giving correct reading order even if rows aren't
// perfectly aligned or icons vary slightly in size.
function sortIntoGrid(boxes) {
  if(!boxes.length) return [];

  const withCenter = boxes.map(b => ({ ...b, cy: b.y + b.h / 2, cx: b.x + b.w / 2 }));
  withCenter.sort((a, b) => a.cy - b.cy);

  const medianH = median(withCenter.map(b => b.h));
  const rowThresh = medianH * 0.6;

  const rows = [];
  let currentRow = [withCenter[0]];
  let rowY = withCenter[0].cy;

  for(let i = 1; i < withCenter.length; i++) {
    const b = withCenter[i];
    if(Math.abs(b.cy - rowY) <= rowThresh) {
      currentRow.push(b);
      rowY = (rowY * (currentRow.length - 1) + b.cy) / currentRow.length;
    } else {
      rows.push(currentRow);
      currentRow = [b];
      rowY = b.cy;
    }
  }
  rows.push(currentRow);

  const ordered = [];
  for(const row of rows) {
    row.sort((a, b) => a.cx - b.cx);
    ordered.push(...row);
  }

  return ordered.map(b => ({ x: b.x, y: b.y, w: b.w, h: b.h }));
}

function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

// ── Page Preview ─────────────────────────────────────────
function drawPagePreview(pageIdx) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, CW, CH);

  const start = pageIdx * ICONS_PER_PAGE;
  const end = Math.min(start + ICONS_PER_PAGE, icons.length);

  for(let i = start; i < end; i++) {
    const slot = i - start;
    const cell = getCellRect(slot);
    const ic = icons[i].canvas;

    // Light cell background
    ctx.fillStyle = '#fafafa';
    ctx.beginPath();
    ctx.roundRect(cell.x, cell.y, cell.w, cell.h, 12);
    ctx.fill();

    // Draw icon fitted in cell
    const ratio = ic.width / ic.height;
    let dw, dh;
    if(ratio > cell.w / cell.h) { dw = cell.w - 20; dh = dw / ratio; }
    else { dh = cell.h - 20; dw = dh * ratio; }
    const dx = cell.x + (cell.w - dw) / 2;
    const dy = cell.y + (cell.h - dh) / 2;
    ctx.drawImage(ic, dx, dy, dw, dh);
  }

  // Page indicator
  const totalPages = Math.ceil(icons.length / ICONS_PER_PAGE);
  ctx.fillStyle = '#94a3b8';
  ctx.font = 'bold 18px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(`Preview · Page ${pageIdx+1} of ${totalPages}`, CW/2, CH - 16);
}

function updateInfo() {
  const total = icons.length;
  const pages = Math.ceil(total / ICONS_PER_PAGE);
  document.getElementById('info-text').textContent = `${total} icons detected · ${pages} pages`;
}

function renderIconStrip() {
  const strip = document.getElementById('icon-strip');
  strip.innerHTML = '';
  icons.forEach((ic, i) => {
    const img = document.createElement('img');
    img.src = ic.dataURL;
    img.className = 'icon-thumb';
    img.title = `Icon ${i+1}`;
    strip.appendChild(img);
  });
}

function updateIconStrip(currentIdx) {
  const thumbs = document.querySelectorAll('.icon-thumb');
  thumbs.forEach((t, i) => {
    t.classList.remove('current', 'done');
    if(i < currentIdx) t.classList.add('done');
    if(i === currentIdx) {
      t.classList.add('current');
      t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  });
}

// ── Pixel Extraction ──────────────────────────────────────
function extractPoints(iconCanvas, cellRect) {
  return new Promise(resolve => {
    // Draw icon into a temp 1080x1080 canvas at the cell position
    const tmp = document.createElement('canvas');
    tmp.width = CW; tmp.height = CH;
    const tCtx = tmp.getContext('2d');
    tCtx.fillStyle = '#fff';
    tCtx.fillRect(0, 0, CW, CH);

    const ic = iconCanvas;
    const cell = cellRect;
    const ratio = ic.width / ic.height;
    let dw, dh;
    if(ratio > cell.w / cell.h) { dw = cell.w - 20; dh = dw / ratio; }
    else { dh = cell.h - 20; dw = dh * ratio; }
    const dx = cell.x + (cell.w - dw) / 2;
    const dy = cell.y + (cell.h - dh) / 2;

    tCtx.imageSmoothingEnabled = true;
    tCtx.drawImage(ic, dx, dy, dw, dh);

    const imgData = tCtx.getImageData(Math.floor(dx), Math.floor(dy), Math.ceil(dw), Math.ceil(dh));
    const data = imgData.data;
    const W = Math.ceil(dw), H = Math.ceil(dh);
    const STEP = 2;
    const tl = [], tr = [], bl = [], br = [];
    const qW = W / 2, qH = H / 2;
    const thresh = settings.thresh;

    for(let y = 0; y < H; y += STEP) {
      for(let x = 0; x < W; x += STEP) {
        const i = (y * W + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if(a > 128) {
          const bright = r*0.299 + g*0.587 + b*0.114;
          if(bright < thresh) {
            const gx = dx + x, gy = dy + y;
            if(y < qH) { x < qW ? tl.push({x:gx,y:gy,r,g,b}) : tr.push({x:gx,y:gy,r,g,b}); }
            else { x < qW ? bl.push({x:gx,y:gy,r,g,b}) : br.push({x:gx,y:gy,r,g,b}); }
          }
        }
      }
    }

    const sort = pts => {
      pts.sort((a,b) => {
        const rA = Math.floor(a.y/12), rB = Math.floor(b.y/12);
        return rA === rB ? a.x - b.x : rA - rB;
      });
      for(let i = pts.length-1; i > 0; i--) {
        if(Math.random() > 0.85) {
          const j = Math.max(0, i - Math.floor(Math.random()*6));
          [pts[i], pts[j]] = [pts[j], pts[i]];
        }
      }
      return pts;
    };

    resolve([...sort(tl), ...sort(tr), ...sort(bl), ...sort(br)]);
  });
}

// ── Animation ─────────────────────────────────────────────
async function playAnim() {
  if(!icons.length) return;
  if(isAnimating) {
    stopAnim();
    return;
  }

  isAnimating = true;
  stopFlag = false;
  document.getElementById('play-btn').textContent = '⏸ Pause';
  document.getElementById('play-btn').disabled = false;
  document.getElementById('stop-btn').style.display = 'flex';
  document.getElementById('progress-bar').style.display = 'block';

  const totalPages = Math.ceil(icons.length / ICONS_PER_PAGE);

  // Persistent canvas — accumulates ALL drawings across all icons on current page
  let persistCanvas = document.createElement('canvas');
  persistCanvas.width = CW; persistCanvas.height = CH;
  let pCtx = persistCanvas.getContext('2d');

  let currentPage = -1;

  for(let i = 0; i < icons.length; i++) {
    if(stopFlag) break;

    const pageIdx = Math.floor(i / ICONS_PER_PAGE);
    const slotInPage = i % ICONS_PER_PAGE;

    // New page — clear persistent canvas and show white
    if(pageIdx !== currentPage) {
      currentPage = pageIdx;
      pCtx.fillStyle = '#fff';
      pCtx.fillRect(0, 0, CW, CH);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, CW, CH);

      // Brief pause between pages (except first)
      if(pageIdx > 0) await pause(800);
    }

    // Update UI
    updateIconStrip(i);
    showStatus(`Icon ${i+1} of ${icons.length} · Page ${pageIdx+1} of ${totalPages}`);
    showProc(`Analyzing icon ${i+1}…`);
    document.getElementById('progress-fill').style.width = '0%';

    const cell = getCellRect(slotInPage);
    const points = await extractPoints(icons[i].canvas, cell);

    hideProc();

    if(!points.length) continue;
    if(stopFlag) break;

    // ── Draw sketch animation ──
    const durationMs = settings.speed * 1000;
    let startTime = null;
    let prevIdx = 0;

    await new Promise(resolve => {
      function frame(ts) {
        if(stopFlag) { resolve(); return; }
        if(!startTime) startTime = ts;
        const t = Math.min((ts - startTime) / durationMs, 1);

        document.getElementById('progress-fill').style.width = (t * 100) + '%';

        const targetIdx = Math.floor(t * points.length);
        const fromIdx = prevIdx > targetIdx ? 0 : prevIdx;
        const batch = targetIdx - fromIdx;

        if(batch > 0) {
          let lastPt = null;

          // Draw batch of dots onto persistent canvas
          for(let k = 0; k < batch; k++) {
            const pt = points[fromIdx + k];
            if(!pt) continue;
            lastPt = pt;

            // Use original color if dark enough, else black
            const brightness = pt.r*0.299 + pt.g*0.587 + pt.b*0.114;
            if(brightness < 30) {
              pCtx.fillStyle = '#111';
            } else {
              pCtx.fillStyle = `rgb(${pt.r},${pt.g},${pt.b})`;
            }

            pCtx.beginPath();
            pCtx.arc(pt.x, pt.y, settings.thick, 0, Math.PI*2);
            pCtx.fill();
          }

          // Composite persistent onto output
          ctx.drawImage(persistCanvas, 0, 0);

          // Draw hand at last point
          if(handImg.complete && lastPt) {
            const hW = 160;
            const hH = (handImg.height / handImg.width) * hW;
            const hX = lastPt.x + (-10/100) * hW;
            const hY = lastPt.y + (-90/100) * hH;
            ctx.drawImage(handImg, hX, hY, hW, hH);
          }

          // Page number
          const totalPgs = Math.ceil(icons.length / ICONS_PER_PAGE);
          ctx.fillStyle = 'rgba(148,163,184,0.6)';
          ctx.font = 'bold 16px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText(`Page ${pageIdx+1} of ${totalPgs}`, CW/2, CH-14);
        }

        prevIdx = targetIdx;

        if(t < 1) {
          animRaf = requestAnimationFrame(frame);
        } else {
          // Finalize — draw clean without hand
          ctx.drawImage(persistCanvas, 0, 0);
          ctx.fillStyle = 'rgba(148,163,184,0.6)';
          ctx.font = 'bold 16px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText(`Page ${pageIdx+1} of ${Math.ceil(icons.length / ICONS_PER_PAGE)}`, CW/2, CH-14);
          animRaf = null;
          setTimeout(resolve, 300);
        }
      }
      animRaf = requestAnimationFrame(frame);
    });
  }

  // Done
  isAnimating = false;
  stopFlag = false;
  document.getElementById('stop-btn').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('play-btn').textContent = '▶ Sketch Again';
  showStatus('✅ Done! All icons sketched.');
  updateIconStrip(-1);
}

function stopAnim() {
  stopFlag = true;
  if(animRaf) cancelAnimationFrame(animRaf);
  animRaf = null;
  isAnimating = false;
  document.getElementById('stop-btn').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('play-btn').textContent = '▶ Sketch All Icons';
  hideProc();
  showStatus('⏹ Stopped');
}

// ── Utils ─────────────────────────────────────────────────
function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

function showStatus(msg) {
  const el = document.getElementById('status-badge');
  el.style.display = 'block';
  el.textContent = msg;
}

function showProc(msg) {
  document.getElementById('proc-text').textContent = msg;
  document.getElementById('proc-overlay').style.display = 'flex';
}
function hideProc() {
  document.getElementById('proc-overlay').style.display = 'none';
}
</script>
